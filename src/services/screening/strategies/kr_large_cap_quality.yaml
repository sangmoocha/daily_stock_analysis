# 韩国大盘质量策略
name: kr_large_cap_quality
display_name: 韩国大盘质量
description: 面向 KOSPI/KOSDAQ 大中盘股的稳定性与流动性候选，结合趋势和量能确认
version: "1.0"
category: quality
tags: [korea, large_cap, quality, stability, multi_factor]
analysis_skills: [bull_trend]
style:
  risk_profile: balanced
  holding_period: watchlist
  execution_style: quality_value
  market_regime: [neutral, range_bound, rotation]
  capital_profile: high_liquidity
  ui_badge: 韩股质量

screening:
  enabled: true
  market_scope: [kr]
  hard_filters:
    exclude_st: false
    amount_min: 5000000000
    market_cap_min: 100000000000
    price_min: 500
    price_max: 1000000
    change_pct_min: -5.0
    change_pct_max: 7.0
    turnover_rate_min: 0.1
    volume_ratio_20d_min: 0.5
    volatility_20d_pct_max: 45.0
    max_drawdown_20d_pct_min: -15.0
    atr_20_pct_max: 7.0
  tech_weight: 0.30
  factor_weights:
    liquidity: 0.24
    stability: 0.26
    size: 0.18
    momentum: 0.16
    activity: 0.10
    reversal: 0.06
  scoring_profile:
    momentum_chase_start_pct: 3.0
    momentum_chase_penalty_slope: 14.0
    activity_ideal_volume_ratio: 1.6
    activity_ideal_turnover_rate: 1.2
    stability_hot_change_pct: 4.5
    stability_high_turnover_rate: 8.0
    stability_high_volume_ratio: 4.0
  risk_profile:
    chase_change_pct: 6.0
    abnormal_volume_ratio: 4.5
    high_turnover_rate: 10.0
    low_llm_confidence: 0.45
  portfolio_profile:
    max_same_bucket: 1
    concentration_penalty: 4.0
    buckets:
      半导体: [반도체, 半导体, 반도체장비]
      汽车: [자동차, 汽车, 자동차부품]
      金融: [은행, 银行, 금융, 保险]
      生物医药: [바이오, 生物, 제약, 医药]
      消费: [유통, 消费, 식품, 食品]
  scorecard_profile:
    value_quality_stability_min: 68.0
    value_quality_bonus: 2.2
    volume_spike_ratio: 4.0
  ranking_hints: |
    优先关注：
    1. 市值和成交额足以支撑后续深度分析的韩国大中盘股
    2. 价格波动不过热，趋势和量能仍有确认空间
    3. 避免单一行业或单一题材过度集中
  max_output: 5
